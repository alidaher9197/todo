<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/signIn.css">
    <link rel="shortcut icon" href="assets/logo/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
</head>

<body>
    <main class="sign">
        <h1>Sign up</h1>
        <form class="sign_form" action="all_todo.html" onsubmit="return checkPasswords()">
            <input type="text" name="username" id="username" placeholder="Enter your username" required minlength="3" maxlength="10" onkeyup="check_signup('username')">
            <div>
                <input type="password" name="password" id="password" placeholder="Enter your password" required minlength="6" maxlength="20" onkeyup="check_signup('password')">
                <i class="fa-solid fa-eye far fa-eye" id="togglePassword"></i>
            </div>
            <div>
                <input type="password" name="password" id="rePassword" placeholder="Re-enter your password" required minlength="6" maxlength="20" onkeyup="check_signup('password')">
                <i class="fa-solid fa-eye far fa-eye" id="toggleRepassword"></i>
            </div>

            <input type="submit" value="Sign up">

            <div class="error" id="error"></div>
        </form>
    </main>
    <script src="scripts/index.js"></script>
</body>

</html>
