<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <link rel="stylesheet" href="styles/root.css">
    <link rel="stylesheet" href="styles/sign.css">
    <link rel="stylesheet" href="styles/update_password.css">
    <link rel="shortcut icon" href="assets/logo/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />


</head>

<body class="update-password">
    <div id="navbar"></div>
    <script src="scripts/nav.js"></script>
    <main class="todo-main">
        <h1>Update Password</h1>
        <form class="todo-form" action="all_todo.html" onsubmit="return checkPasswords()">
            <div>
                <input type="password" name="password" id="password" placeholder="Enter your password" required minlength="6" maxlength="20">
                <i class="fa-solid fa-eye far fa-eye" id="old-password"></i>
            </div>
            <div>
                <input type="password" name="password" id="new-password-field" placeholder="Enter your password" required minlength="6" maxlength="20">
                <i class="fa-solid fa-eye far fa-eye" id="new-password"></i>
            </div>
            <div>
                <input type="password" name="password" id="re-password-field" placeholder="Re-enter your password" required minlength="6" maxlength="20">
                <i class="fa-solid fa-eye far fa-eye" id="re-password"></i>
            </div>

            <input type="submit" value="Update Password">

            <div class="error" id="error"></div>
        </form>
    </main>
    <script src="scripts/update_password.js"></script>
</body>

</html>
